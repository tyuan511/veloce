[package]
name = "veloce"
description = "Veloce — a GPU-accelerated, keyboard-first unified file manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "veloce"
path = "src/main.rs"

[dependencies]
vfs-core = { path = "../vfs-core" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
nucleo-matcher.workspace = true
open.workspace = true
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
# Pure-Rust regex backend: no C dependency, still ships the default grammars.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Tree-sitter highlighting, the engine Zed uses, for the languages below.
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-c-sharp = "0.23"

[dev-dependencies]
tempfile = "3"
