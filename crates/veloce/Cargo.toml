[package]
name = "veloce"
description = "Veloce — a GPU-accelerated, keyboard-first unified file manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "veloce"
path = "src/main.rs"

[dependencies]
vfs-core = { path = "../vfs-core" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
nucleo-matcher.workspace = true
open.workspace = true
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
# Pure-Rust regex backend: no C dependency, still ships the default grammars.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"
