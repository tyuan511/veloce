[package]
name = "vfs-core"
description = "Protocol-agnostic async virtual filesystem core for Veloce"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-trait = "0.1"
bytes = "1"
futures.workspace = true
chrono.workspace = true
ignore.workspace = true
notify.workspace = true
nucleo-matcher.workspace = true
trash.workspace = true
opendal = { version = "0.59", default-features = false, features = ["services-s3", "services-webdav", "services-sftp", "services-memory", "http-transport-reqwest", "executors-tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
