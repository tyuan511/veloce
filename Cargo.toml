[workspace]
members = ["crates/vfs-core", "crates/veloce"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
async-channel = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures = "0.3"
ignore = "0.4"
notify = "8.2"
nucleo-matcher = "0.3"
open = "5.4"
trash = "5.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
